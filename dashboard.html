<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — FastBites Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <div class="sidebar">
      <h1>🍔 FastBites</h1>
      <div id="sidebar-nav"></div>
      <div class="logout"><a href="#" onclick="logout()">🚪 Logout</a></div>
    </div>
    <div class="main">
      <h2>Dashboard</h2>
      <p class="subtitle">Quick overview of your store</p>

      <div class="stat-row" id="statRow">
        <div class="stat-card"><div class="num">-</div><div class="label">Total Users</div></div>
        <div class="stat-card"><div class="num">-</div><div class="label">Total Orders</div></div>
        <div class="stat-card"><div class="num">-</div><div class="label">Pending / COD Payments</div></div>
        <div class="stat-card"><div class="num">-</div><div class="label">Cancelled Orders</div></div>
      </div>

      <div class="section-title">Recent Orders</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Placed</th></tr></thead>
          <tbody id="recentOrdersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="common.js"></script>
<script>
  renderSidebar('dashboard');

  async function load() {
    const [usersRes, ordersRes] = await Promise.all([
      apiFetch('/api/users'),
      apiFetch('/api/orders')
    ]);
    if (!usersRes || !ordersRes) return;
    const users = await usersRes.json();
    const orders = await ordersRes.json();

    const pendingPayments = orders.filter(o => o.payment_status === 'PENDING').length;
    const cancelled = orders.filter(o => o.order_status === 'CANCELLED').length;

    const cards = document.querySelectorAll('.stat-card .num');
    cards[0].innerText = users.length;
    cards[1].innerText = orders.length;
    cards[2].innerText = pendingPayments;
    cards[3].innerText = cancelled;

    const body = document.getElementById('recentOrdersBody');
    if (orders.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty-state">No orders yet</td></tr>';
      return;
    }
    body.innerHTML = orders.slice(0, 8).map(o => `
      <tr>
        <td>#${o.id}</td>
        <td>${escapeHtml(o.customer_name)}<br><span style="color:#999;font-size:11px;">@${escapeHtml(o.username)}</span></td>
        <td>₹${o.total}</td>
        <td><span class="badge ${o.payment_mode === 'UPI' ? 'paid' : 'cod'}">${o.payment_mode}</span> <span class="badge ${o.payment_status.toLowerCase()}">${o.payment_status}</span></td>
        <td><span class="badge ${o.order_status.toLowerCase()}">${o.order_status.replace(/_/g,' ')}</span></td>
        <td>${timeAgo(o.created_at)}</td>
      </tr>
    `).join('');
  }

  load();
</script>
</body>
</html>
