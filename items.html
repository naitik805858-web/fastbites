<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Items & Categories — FastBites Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <div class="sidebar">
      <h1>🍔 FastBites</h1>
      <div id="sidebar-nav"></div>
      <div class="logout"><a href="#" onclick="logout()">🚪 Logout</a></div>
    </div>
    <div class="main">
      <h2>Items & Categories</h2>
      <p class="subtitle">Add new categories, then add menu items under them</p>

      <div style="display:flex; gap:20px; flex-wrap:wrap;">
        <div class="form-card" style="flex:1; min-width:260px;">
          <b>➕ Add Category</b>
          <label>Category Name</label>
          <input type="text" id="catName" placeholder="e.g. Desserts">
          <button class="btn" onclick="addCategory()">Add Category</button>
        </div>

        <div class="form-card" style="flex:1.4; min-width:300px;">
          <b>➕ Add Item</b>
          <label>Item Name</label>
          <input type="text" id="itemName" placeholder="e.g. Cheese Burger">
          <label>Category</label>
          <select id="itemCategory"></select>
          <label>Price (₹)</label>
          <input type="number" id="itemPrice" placeholder="199">
          <label>Image URL</label>
          <input type="text" id="itemImage" placeholder="https://...">
          <label>Description (short, shown on the card)</label>
          <textarea id="itemDesc" rows="2" placeholder="Short description"></textarea>
          <label>Full Description (shown when customer opens the item)</label>
          <textarea id="itemLongDesc" rows="3" placeholder="Optional — leave blank to reuse the short description"></textarea>
          <div style="display:flex; gap:10px;">
            <div style="flex:1;">
              <label>Prep Time</label>
              <input type="text" id="itemPrepTime" placeholder="e.g. 20 mins">
            </div>
            <div style="flex:1;">
              <label>Rating (1-5)</label>
              <input type="number" id="itemRating" placeholder="4.5" step="0.1" min="1" max="5">
            </div>
          </div>
          <button class="btn" onclick="addItem()">Add Item</button>
        </div>
      </div>

      <div class="section-title">Categories</div>
      <div class="table-wrap" style="margin-bottom: 24px;">
        <table>
          <thead><tr><th>Name</th><th>Items in Category</th><th></th></tr></thead>
          <tbody id="categoriesBody"></tbody>
        </table>
      </div>

      <div class="section-title">All Menu Items</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr></thead>
          <tbody id="itemsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script src="common.js"></script>
<script>
  renderSidebar('items');
  let categories = [];
  let items = [];

  async function loadAll() {
    const [catRes, itemRes] = await Promise.all([apiFetch('/api/categories'), apiFetch('/api/items')]);
    if (!catRes || !itemRes) return;
    categories = await catRes.json();
    items = await itemRes.json();
    renderCategorySelect();
    renderCategoriesTable();
    renderItemsTable();
  }

  function renderCategorySelect() {
    const sel = document.getElementById('itemCategory');
    sel.innerHTML = categories.length
      ? categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')
      : '<option value="">Add a category first</option>';
  }

  function renderCategoriesTable() {
    const body = document.getElementById('categoriesBody');
    if (categories.length === 0) {
      body.innerHTML = '<tr><td colspan="3" class="empty-state">No categories yet</td></tr>';
      return;
    }
    body.innerHTML = categories.map(c => {
      const count = items.filter(i => i.category_id === c.id).length;
      return `
        <tr>
          <td><b>${escapeHtml(c.name)}</b></td>
          <td>${count} item(s)</td>
          <td><button class="btn danger btn-sm" onclick="deleteCategory(${c.id})">Delete</button></td>
        </tr>`;
    }).join('');
  }

  function renderItemsTable() {
    const body = document.getElementById('itemsBody');
    if (items.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty-state">No items yet</td></tr>';
      return;
    }
    body.innerHTML = items.map(i => `
      <tr>
        <td>${i.image_url ? `<img class="thumb" src="${escapeHtml(i.image_url)}">` : '—'}</td>
        <td><b>${escapeHtml(i.name)}</b><br><span style="color:#999;font-size:11px;">${escapeHtml(i.description||'')}</span></td>
        <td>${escapeHtml(i.category_name) || '<span style="color:#aaa;">Uncategorized</span>'}</td>
        <td>₹${i.price}</td>
        <td>${i.available ? '<span class="badge delivered">Yes</span>' : '<span class="badge cancelled">No</span>'}</td>
        <td><button class="btn danger btn-sm" onclick="deleteItem(${i.id})">Delete</button></td>
      </tr>
    `).join('');
  }

  async function addCategory() {
    const name = document.getElementById('catName').value.trim();
    if (!name) return alert('Enter a category name');
    const r = await apiFetch('/api/categories', { method: 'POST', body: JSON.stringify({ name }) });
    const data = await r.json();
    if (!r.ok) return alert(data.error || 'Failed to add');
    document.getElementById('catName').value = '';
    loadAll();
  }

  async function deleteCategory(id) {
    if (!confirm('Delete this category?')) return;
    await apiFetch(`/api/categories/${id}`, { method: 'DELETE' });
    loadAll();
  }

  async function addItem() {
    const name = document.getElementById('itemName').value.trim();
    const category_id = document.getElementById('itemCategory').value;
    const price = document.getElementById('itemPrice').value;
    const image_url = document.getElementById('itemImage').value.trim();
    const description = document.getElementById('itemDesc').value.trim();
    const long_description = document.getElementById('itemLongDesc').value.trim();
    const prep_time = document.getElementById('itemPrepTime').value.trim();
    const rating = document.getElementById('itemRating').value;
    if (!name || !price) return alert('Name and price are required');
    const r = await apiFetch('/api/items', {
      method: 'POST',
      body: JSON.stringify({
        name, category_id, price: Number(price), image_url, description,
        long_description, prep_time, rating: rating ? Number(rating) : undefined
      })
    });
    const data = await r.json();
    if (!r.ok) return alert(data.error || 'Failed to add');
    ['itemName','itemPrice','itemImage','itemDesc','itemLongDesc','itemPrepTime','itemRating'].forEach(id => document.getElementById(id).value = '');
    loadAll();
  }

  async function deleteItem(id) {
    if (!confirm('Delete this item?')) return;
    await apiFetch(`/api/items/${id}`, { method: 'DELETE' });
    loadAll();
  }

  loadAll();
</script>
</body>
</html>
