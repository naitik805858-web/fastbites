<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - FastBites</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f172a; }
    .card { background: white; padding: 32px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    h2 { margin-bottom: 20px; text-align: center; color: #1e293b; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #475569; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #f59e0b; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #d97706; }
    .error { color: #dc2626; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🍔 FastBites Admin</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btnText">Login</button>
      <div id="errorMsg" class="error"></div>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('errorMsg');
      const btn = document.getElementById('btnText');
      errorEl.style.display = 'none';
      btn.innerText = 'Logging in...';
      btn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.token) {
          // Dono keys me token save taaki koi conflict na ho
          localStorage.setItem('fastbites_admin_token', data.token);
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('fastbites_admin_user', data.username);
          
          window.location.href = 'dashboard.html';
        } else {
          errorEl.innerText = data.error || 'Invalid credentials';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.innerText = 'Server error. Please check backend.';
        errorEl.style.display = 'block';
      } finally {
        btn.innerText = 'Login';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
