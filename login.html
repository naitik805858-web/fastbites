<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login — FastBites</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h2>🍔 FastBites Admin</h2>
      <p>Login to manage users, orders, menu & banners</p>
      <input type="text" id="username" placeholder="Username" value="admin">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <p class="login-error" id="loginError">Invalid username or password</p>
      <p class="hint">Default: admin / admin123</p>
    </div>
  </div>

<script>
  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (!r.ok) {
        errEl.innerText = data.error || 'Login failed';
        errEl.style.display = 'block';
        return;
      }
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminUsername', data.username);
      window.location.href = 'dashboard.html';
    } catch (e) {
      errEl.innerText = 'Server not reachable. Is the backend running?';
      errEl.style.display = 'block';
    }
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
